<!DOCTYPE html>
<html lang="zh-CN" data-i18n-doc-title="doc_registry">
<head>
<meta charset="utf-8">
<title>设备清册 — ORPAH-over-HaLow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260911a">
<style>
  .back { margin-left: 10px; }
  .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row input, .row select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .row input.name { width: 120px; }
  .row input.note { width: 220px; }
  .row input.sn { width: 220px; }
  .row input.age { width: 60px; }
  .row input.photo { width: 200px; }
  .row input.mid { width: 160px; }
  .filepick { display: flex; align-items: center; gap: 8px; }
  .fname {
    color: var(--mut); font-size: 12px; max-width: 170px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thumb { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }
  table.reg { border-collapse: collapse; width: 100%; margin-top: 12px; }
  table.reg th, table.reg td { padding: 6px 10px; text-align: left; font-size: 13px; }
  table.reg th { color: var(--mut); font-weight: 400; border-bottom: 1px solid var(--bd); }
  table.reg td { border-bottom: 1px solid #21262d; }
  table.reg select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 3px 6px; font-size: 12px;
  }
  .badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; border: 1px solid; display: inline-block; }
  .st-active { color: var(--grn); border-color: var(--grn); }
  .st-disabled { color: var(--mut); border-color: var(--mut); }
  .st-lost { color: var(--red); border-color: var(--red); }
  .st-scrapped { color: #6e7681; border-color: #6e7681; }
  .person-name { font-weight: 600; }
  .note-cell { color: var(--mut); }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input, .toolbar select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 4px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .toolbar input { width: 210px; }
  tr.hl { background: rgba(88, 166, 255, .10); }
  .hint.err { color: var(--red); }
  .edit-name, .edit-note {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 4px; padding: 2px 6px; font-size: 13px; width: 100%;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a href="index.html" data-i18n-title="nav_home_title" title="返回主页"><img class="brand-logo" src="orpah-logo.png" alt="orpah"></a>
    <span class="brand-name" data-i18n="nav_registry">设备清册</span>
    <span class="sub" data-i18n="reg_sub">Orpah ID · 客户端台账（一个走失者可绑多台设备）</span>
    <a class="btn back" href="case.html" data-i18n="nav_case">走失案件</a>
    <a class="btn back" href="index.html" data-i18n="nav_home">← 返回主页</a>
    <button class="btn" id="langBtn" title="中文 / English"></button>
  </div>
</header>

<section class="card">
  <h3 data-i18n="reg_sec1">1 · 登记</h3>
  <div class="row">
    <label><span data-i18n="f_name">姓名</span> <input class="name" id="personName" data-i18n-ph="ph_name" placeholder="姓名"></label>
    <label><span data-i18n="f_gender">性别</span>
      <select id="personGender">
        <option value="" data-i18n="g_unknown">未知</option>
        <option value="男" data-i18n="g_m">男</option>
        <option value="女" data-i18n="g_f">女</option>
      </select>
    </label>
    <label><span data-i18n="f_age">年龄</span> <input class="age" id="personAge" data-i18n-ph="ph_age_y" placeholder="岁"></label>
    <label><span data-i18n="f_height">身高(cm)</span> <input class="age" id="personHeight" data-i18n-ph="ph_cm" placeholder="cm"></label>
    <label><span data-i18n="f_build">体重/体型</span> <input class="mid" id="personBuild" data-i18n-ph="ph_build" placeholder="如 60kg/偏瘦"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <label><span data-i18n="f_features">体貌特征</span> <input class="mid" id="personFeatures" data-i18n-ph="ph_features" placeholder="如 左臂胎记"></label>
    <label><span data-i18n="f_health">疾病/健康</span> <input class="mid" id="personHealth" data-i18n-ph="ph_health" placeholder="如 阿尔茨海默"></label>
    <label><span data-i18n="f_mental">精神状态</span> <input class="mid" id="personMental" data-i18n-ph="ph_mental" placeholder="如 正常/神志不清"></label>
    <label><span data-i18n="f_comm">沟通能力</span> <input class="mid" id="personCommunicate" data-i18n-ph="ph_comm" placeholder="如 能说姓名"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="filepick">
      <span data-i18n="f_photo">照片</span>
      <button type="button" class="btn sm" id="photoPickBtn" data-i18n="btn_choose_file">选择文件</button>
      <span class="fname" id="photoPickName" data-i18n="no_file">未选择文件</span>
      <input type="file" id="personPhotoFile" accept="image/*" hidden>
    </span>
    <img id="personPhotoThumb" class="thumb" hidden data-i18n-alt="ph_thumb" alt="缩略图">
    <label><span data-i18n="f_note">备注</span> <input class="note" id="personNote" data-i18n-ph="ph_note" placeholder="备注"></label>
    <button class="btn" id="btnAddPerson" data-i18n="btn_add_person">添加人员</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label>SN <input class="sn" id="deviceSn" placeholder="CN-WH01-XXXXXXXX" spellcheck="false"></label>
    <label><span data-i18n="f_bind_to">绑定到</span>
      <select id="addPerson"><option value="" data-i18n="opt_unbound">（未绑定）</option></select>
    </label>
    <button class="btn" id="btnAddDevice" data-i18n="btn_add_device">添加/绑定设备</button>
    <span class="hint" id="snHint"></span>
  </div>
</section>

<section class="card">
  <h3 data-i18n="reg_sec2">2 · 走失者管理</h3>
  <div class="toolbar">
    <input id="pq" data-i18n-ph="ph_search_person" placeholder="搜索编号 / 名称 / 备注…" spellcheck="false">
  </div>
  <table class="reg">
    <thead><tr>
      <th data-i18n="th_pid">编号</th><th data-i18n="th_name">名称</th><th data-i18n="th_gender">性别</th><th data-i18n="th_age">年龄</th><th data-i18n="th_note">备注</th><th data-i18n="th_devcnt">设备数</th><th data-i18n="th_ops">操作</th>
    </tr></thead>
    <tbody id="personBody"></tbody>
  </table>
</section>

<section class="card">
  <h3 data-i18n="reg_sec3">3 · 设备台账</h3>
  <div class="toolbar">
    <input id="q" data-i18n-ph="ph_search_dev" placeholder="搜索 SN / 走失者…" spellcheck="false">
    <select id="fStatus">
      <option value="" data-i18n="opt_all_status">全部状态</option>
      <option value="active" data-i18n="st_active">启用</option>
      <option value="disabled" data-i18n="st_disabled">停用</option>
      <option value="lost" data-i18n="st_lost">丢失</option>
      <option value="scrapped" data-i18n="st_scrapped">报废</option>
    </select>
    <span style="flex:1"></span>
    <select id="batchStatus">
      <option value="" data-i18n="opt_batch">批量操作…</option>
      <option value="active" data-i18n="batch_active">批量标记启用</option>
      <option value="disabled" data-i18n="batch_disabled">批量标记停用</option>
      <option value="lost" data-i18n="batch_lost">批量标记丢失</option>
      <option value="scrapped" data-i18n="batch_scrapped">批量标记报废</option>
    </select>
    <button class="btn" id="btnBatch" data-i18n="btn_apply">应用</button>
  </div>
  <table class="reg">
    <thead><tr>
      <th><input type="checkbox" id="chkAll" data-i18n-title="th_chk_all" title="全选"></th>
      <th>SN</th><th data-i18n="th_person">走失者</th><th data-i18n="th_org">组织</th><th data-i18n="th_status">状态</th>
      <th data-i18n="th_first">首次见</th><th data-i18n="th_last">最近见</th><th data-i18n="th_stop">状态操作</th><th></th>
    </tr></thead>
    <tbody id="deviceBody"></tbody>
  </table>
  <p class="hint" data-i18n="reg_hint">一个走失者可绑多台设备（项链/鞋/眼镜…）；未绑定设备列「—」。最近见时间随上报实时刷新。</p>
</section>

<script src="ui_i18n.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const T = (k) => OrpahI18n.t(k);
const STATUSES = ["active", "disabled", "lost", "scrapped"];
// 状态/性别展示标签（机器值不变，只翻展示）
const SL = {
  active: T("st_active"), disabled: T("st_disabled"),
  lost: T("st_lost"), scrapped: T("st_scrapped"),
};
const GL = { "": T("g_unknown"), "男": T("g_m"), "女": T("g_f") };
const genderLabel = (v) => GL[v] || v;
// 协议 §2：CC-ORG-UNIQUE[-CHECK]（CC=ISO 3166-1 alpha-2；ORG/UNIQUE=Crockford Base32）
const SN_RE = /^[A-Z]{2}-[0-9A-HJKMNP-TV-Z]{2,6}-[0-9A-HJKMNP-TV-Z]{8,16}(-[0-9A-HJKMNP-TV-Z]{1,2})?$/;
// index.html 报文流 SN 点进来时定位/高亮该设备
const URL_SN = new URLSearchParams(location.search).get("sn");
let scrolled = false;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
/* 拼进选择器用的转义（SN 只含 A-Z0-9-，仍走标准转义防意外） */
const cssQ = (s) => (window.CSS && CSS.escape)
  ? CSS.escape(String(s)) : String(s).replace(/["\\]/g, "\\$&");
function fmtT(ts) {
  if (ts === null || ts === undefined) return "—";
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  const mmdd = `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const hms = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const dayDiff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (dayDiff <= 0) return hms;
  if (dayDiff === 1) return `${mmdd} ${hms} · ${T("t_yesterday")}`;
  return `${mmdd} ${hms} · ${T("t_days_ago").replace("{n}", dayDiff)}`;
}
async function api(body) {
  let r;
  try {
    const resp = await fetch("/api/registry", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    r = await resp.json();
  } catch (e) {
    console.error("registry:", e);
    alert(T("err_offline"));
    return { ok: false };
  }
  if (!r.ok) {
    console.error("registry:", r.err);
    alert(T("err_prefix") + (r.err || T("err_unknown")));
  }
  return r;
}

let cache = { persons: [], devices: [] };
let editingPid = null;
let paused = false;
let pendingPhoto = "";

function render(r) {
  cache = r;
  // 绑定下拉：同样只在人员集合变化时重建（每秒重建会把用户正在展开的选项冲掉）
  const sel = $("addPerson");
  const psig = r.persons.map(p => p.pid + "\u0000" + p.name).join("|");
  if (sel.dataset.sig !== psig) {
    sel.dataset.sig = psig;
    const cur = sel.value;
    sel.innerHTML = `<option value="">${esc(T("opt_unbound"))}</option>` +
      r.persons.map(p => `<option value="${esc(p.pid)}">${esc(p.name)}</option>`).join("");
    if (sel.querySelector(`option[value="${cur}"]`)) sel.value = cur;
  }

  const nameOf = (pid) => {
    const p = r.persons.find(x => x.pid === pid);
    return p ? p.name : pid;
  };

  // 走失者管理表（搜索；编辑中暂不过滤，避免编辑行被滤掉后无法保存/取消）
  const pq = editingPid ? "" : ($("pq").value || "").trim().toLowerCase();
  const persons = r.persons.filter(p => {
    if (!pq) return true;
    return p.pid.toLowerCase().includes(pq) ||
           (p.name || "").toLowerCase().includes(pq) ||
           (p.note || "").toLowerCase().includes(pq);
  });
  const pbody = $("personBody");
  pbody.innerHTML = persons.map(p => {
    const cnt = r.devices.filter(d => d.person_id === p.pid).length;
    if (p.pid === editingPid) {
      return `<tr data-pid="${esc(p.pid)}">
        <td class="mono">${esc(p.pid)}</td>
        <td><input class="edit-name" value="${esc(p.name)}"></td>
        <td>${esc(p.gender ? genderLabel(p.gender) : "—")}</td>
        <td>${esc(p.age || "—")}</td>
        <td><input class="edit-note" value="${esc(p.note || "")}"></td>
        <td>${cnt}</td>
        <td>
          <button class="btn sm" data-act="save">${esc(T("btn_save"))}</button>
          <button class="btn sm" data-act="cancel">${esc(T("btn_cancel"))}</button>
        </td>
      </tr>`;
    }
    return `<tr data-pid="${esc(p.pid)}">
      <td class="mono">${esc(p.pid)}</td>
      <td class="person-name">${esc(p.name)}</td>
      <td>${esc(p.gender ? genderLabel(p.gender) : "—")}</td>
      <td>${esc(p.age || "—")}</td>
      <td class="note-cell">${esc(p.note || "—")}</td>
      <td>${cnt}</td>
      <td>
        <button class="btn sm" data-act="edit">${esc(T("btn_edit"))}</button>
        <button class="btn sm danger" data-act="del">${esc(T("btn_del"))}</button>
      </td>
    </tr>`;
  }).join("");

  // 设备台账（搜索 + 状态过滤）
  const q = ($("q").value || "").trim().toLowerCase();
  const fs = $("fStatus").value;
  const rows = r.devices.filter(d => {
    if (fs && d.status !== fs) return false;
    if (q) {
      const name = d.person_id ? nameOf(d.person_id) : "";
      if (!d.sn.toLowerCase().includes(q) && !name.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const tbody = $("deviceBody");
  // 只在「设备集合/顺序」变化时整表重建；否则就地改单元格。
  // 原因：轮询每 1s 一次，整表重建会销毁用户正在操作的原生 <select>（下拉一被销毁
  // 选择就丢了 → 表现为「状态操作点不动」），并清空批量勾选。
  const sns = rows.map(d => d.sn).join("|");
  if (tbody.dataset.sns !== sns) {
    tbody.dataset.sns = sns;
    tbody.innerHTML = rows.map(d => {
      const name = d.person_id ? nameOf(d.person_id) : "—";
      const opts = STATUSES.map(s =>
        `<option value="${s}" ${s === d.status ? "selected" : ""}>${SL[s]}</option>`).join("");
      return `<tr data-sn="${esc(d.sn)}">
        <td><input type="checkbox" class="chk" data-sn="${esc(d.sn)}"></td>
        <td class="mono">${esc(d.sn)}</td>
        <td class="person-name" data-c="person">${esc(name)}</td>
        <td class="mono" data-c="org">${esc(d.cc)}-${esc(d.org)}</td>
        <td><span class="badge st-${esc(d.status)}" data-c="badge">${esc(SL[d.status] || d.status)}</span></td>
        <td class="mono" data-c="first">${fmtT(d.first_seen)}</td>
        <td class="mono" data-c="last">${fmtT(d.last_seen)}</td>
        <td><select class="stsel" data-c="sel">${opts}</select></td>
        <td><button class="btn sm danger" data-act="del">${esc(T("btn_del"))}</button></td>
      </tr>`;
    }).join("");
  } else {
    rows.forEach(d => {
      const tr = tbody.querySelector(`tr[data-sn="${cssQ(d.sn)}"]`);
      if (!tr) return;
      const set = (c, v) => { const e = tr.querySelector(`[data-c="${c}"]`); if (e) e.textContent = v; };
      set("person", d.person_id ? nameOf(d.person_id) : "—");
      set("org", `${d.cc}-${d.org}`);
      const badge = tr.querySelector('[data-c="badge"]');
      if (badge) { badge.className = "badge st-" + d.status; badge.textContent = SL[d.status] || d.status; }
      set("first", fmtT(d.first_seen));
      set("last", fmtT(d.last_seen));
      const sel = tr.querySelector('[data-c="sel"]');
      // 只在下拉当前值与服务端不一致时同步（用户正在下拉里选时其 value 尚未变，不会被冲掉）
      if (sel && sel.value !== d.status) sel.value = d.status;
    });
  }

  // 全选联动（勾选状态存在 DOM 上，靠上面的「不重建」保住）
  const checks = [...tbody.querySelectorAll(".chk")];
  const chkAll = $("chkAll");
  chkAll.checked = checks.length > 0 && checks.every(c => c.checked);
  chkAll.onchange = () => checks.forEach(c => c.checked = chkAll.checked);

  // 行内状态切换 / 删除设备：事件委托（重建与否都不用重新绑定）
  tbody.onchange = async (e) => {
    const s = e.target.closest("select.stsel");
    if (!s) return;
    const tr = s.closest("tr");
    await api({ action: "set_status", sn: tr.dataset.sn, status: s.value });
    load();
  };
  tbody.onclick = async (e) => {
    const b = e.target.closest("button[data-act='del']");
    if (!b) return;
    const sn = b.closest("tr").dataset.sn;
    if (!confirm(T("confirm_del_dev").replace("{sn}", sn))) return;
    await api({ action: "remove_device", sn });
    load();
  };

  // 编辑 / 删除走失者
  pbody.querySelectorAll("button[data-act]").forEach(b => {
    b.onclick = async () => {
      const tr = b.closest("tr");
      const pid = tr.dataset.pid;
      const p = r.persons.find(x => x.pid === pid);
      const act = b.dataset.act;
      if (act === "edit") {
        editingPid = pid;
        paused = true;
        render(cache);
      } else if (act === "save") {
        const name = tr.querySelector(".edit-name").value.trim();
        const note = tr.querySelector(".edit-note").value.trim();
        editingPid = null;
        paused = false;
        await api({ action: "update_person", pid, name, note });
        load();
      } else if (act === "cancel") {
        editingPid = null;
        paused = false;
        render(cache);
      } else if (act === "del") {
        if (!confirm(T("confirm_del_person")
            .replace("{name}", p ? p.name : pid))) return;
        await api({ action: "remove_person", pid });
        load();
      }
    };
  });

  highlightFromUrl();
}

function highlightFromUrl() {
  if (!URL_SN) return;
  const tr = [...$("deviceBody").children].find(t =>
    (t.dataset.sn || "").toLowerCase() === URL_SN.toLowerCase());
  if (tr) {
    tr.classList.add("hl");
    if (!scrolled) { tr.scrollIntoView({ block: "center" }); scrolled = true; }
  }
}

async function load() {
  try {
    const resp = await fetch("/api/registry");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const r = await resp.json();
    if (r && r.devices) render(r);
  } catch (e) {
    console.error("load failed", e);
  }
}
async function schedule() {
  if (!paused) await load();
  setTimeout(schedule, 1000);
}

$("btnAddPerson").onclick = async () => {
  const name = $("personName").value.trim();
  if (!name) return;
  await api({ action: "add_person", name, note: $("personNote").value.trim(),
              gender: $("personGender").value, age: $("personAge").value.trim(),
              photo: pendingPhoto, height: $("personHeight").value.trim(),
              build: $("personBuild").value.trim(), features: $("personFeatures").value.trim(),
              health: $("personHealth").value.trim(), mental: $("personMental").value.trim(),
              communicate: $("personCommunicate").value.trim() });
  $("personName").value = ""; $("personNote").value = "";
  $("personGender").value = ""; $("personAge").value = "";
  $("personHeight").value = ""; $("personBuild").value = "";
  $("personFeatures").value = ""; $("personHealth").value = "";
  $("personMental").value = ""; $("personCommunicate").value = "";
  pendingPhoto = ""; $("personPhotoFile").value = "";
  $("personPhotoThumb").hidden = true; setPhotoName();
  load();
};

// 原生 <input type=file> 的「选择文件 / 未选择文件」是浏览器 chrome 文字（跟随浏览器界面语言，
// 页面无法翻译）→ 隐藏原生控件，用自己的按钮 + 文件名标签。
function setPhotoName() {
  const f = $("personPhotoFile").files[0];
  $("photoPickName").textContent = f ? f.name : T("no_file");
}
$("photoPickBtn").onclick = () => $("personPhotoFile").click();

$("personPhotoFile").onchange = async () => {
  const f = $("personPhotoFile").files[0];
  setPhotoName();
  if (!f) return;
  try {
    const resp = await fetch("/api/upload?filename=" + encodeURIComponent(f.name), {
      method: "POST", headers: { "Content-Type": "application/octet-stream" },
      body: f,
    });
    const r = await resp.json();
    if (r.ok) {
      pendingPhoto = r.url;
      const t = $("personPhotoThumb");
      t.src = r.url; t.hidden = false;
    } else {
      alert(T("err_upload") + (r.err || T("err_unknown")));
    }
  } catch (e) {
    console.error("upload:", e);
    alert(T("err_upload_net"));
  }
};
$("btnAddDevice").onclick = async () => {
  const sn = $("deviceSn").value.trim().toUpperCase();
  const hint = $("snHint");
  if (!sn) { hint.textContent = T("sn_need"); hint.className = "hint err"; return; }
  if (!SN_RE.test(sn)) {
    hint.textContent = T("sn_bad_format");
    hint.className = "hint err";
    return;
  }
  hint.textContent = ""; hint.className = "hint";
  await api({ action: "add_device", sn, person_id: $("addPerson").value || null });
  $("deviceSn").value = "";
  load();
};
$("btnBatch").onclick = async () => {
  const status = $("batchStatus").value;
  if (!status) return;
  const sns = [...document.querySelectorAll("#deviceBody .chk:checked")].map(c => c.dataset.sn);
  if (!sns.length) { alert(T("err_no_pick")); return; }
  await api({ action: "set_status_many", sns, status });
  $("batchStatus").value = "";
  load();
};
$("q").oninput = () => render(cache);
$("fStatus").onchange = () => render(cache);
$("pq").oninput = () => render(cache);

OrpahI18n.apply();
schedule();
</script>
</body>
</html>
