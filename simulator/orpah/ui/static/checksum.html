<!DOCTYPE html>
<html lang="zh-CN" data-i18n-doc-title="doc_checksum">
<head>
<meta charset="utf-8">
<title>SN 校验码工具 — ORPAH-over-HaLow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260910c">
<style>
  .back { margin-left: 10px; }
  .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
  .tabs { display: flex; gap: 6px; margin: 10px 0 14px; }
  .tab {
    background: #21262d; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px;
  }
  .tab:hover { background: #30363d; }
  .tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .io { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .io input {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 6px 10px; font-size: 14px; width: 260px;
    font-family: "Cascadia Code", Consolas, monospace;
    text-transform: uppercase;
  }
  .io input.cc { width: 70px; }
  .cc-name { color: var(--txt); font-size: 14px; font-weight: 600; margin-left: 8px; }
  .io .out { font-family: "Cascadia Code", Consolas, monospace; font-size: 15px; }
  .demo-result { font-size: 12px; color: var(--txt); white-space: pre-line; }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="index.html" data-i18n-title="nav_home_title" title="返回主页"><img class="brand-logo" src="orpah-logo.png" alt="orpah"></a> <span class="brand-name" data-i18n="cs_brand">SN 校验码工具</span>
    <span class="sub" data-i18n="cs_sub">Orpah ID · CHECK 校验位计算（CC=CN，校验位只算 ORG-UNIQUE）</span>
    <a class="btn back" href="damm32.html" data-i18n="nav_damm32">Damm32 构造</a>
    <a class="btn back" href="index.html" data-i18n="nav_home">← 返回主页</a>
    <button class="btn" id="langBtn" title="中文 / English"></button>
  </div>
</header>

<section class="card">
  <h3 data-i18n="cs_title">校验位计算器</h3>
  <div class="tabs" id="tabs">
    <button class="tab active" data-algo="damm32" data-i18n="cs_tab_d32">Damm32（1 位）</button>
    <button class="tab" data-algo="luhn32" data-i18n="cs_tab_l32">Luhn32（1 位）</button>
    <button class="tab" data-algo="mod97" data-i18n="cs_tab_m97">Mod97（2 位）</button>
  </div>
  <div class="io">
    <label><span class="hint" data-i18n="cs_cc_hint">CC（ISO 3166-1 alpha-2，不参与校验）</span><br>
      <input id="ccInput" class="cc" list="ccList" value="CN" maxlength="2" spellcheck="false" autocomplete="off" data-i18n-ph="cs_cc_ph" data-i18n-title="cs_cc_tt" placeholder="如 CN" title="输入两位国家码"><span class="cc-name" id="ccName">中国</span></label>
    <datalist id="ccList"></datalist>
    <label><span class="hint" data-i18n="cs_org_hint">ORG-UNIQUE（Crockford；校验位只算这段，不含 CC）</span><br>
      <input id="orgUnique" value="WH01-9AF3C1D2" spellcheck="false"></label>
    <div class="out">
      <div><span data-i18n="cs_out_check">校验位：</span><b id="checkOut">-</b></div>
      <div><span data-i18n="cs_out_full">整串：</span><code id="fullOut">-</code></div>
      <div><span data-i18n="cs_out_verify">校验：</span><b id="verifyOut">-</b></div>
    </div>
  </div>
  <div class="config-row" style="margin-top:12px">
    <button class="btn" id="btnDemo" data-i18n="cs_demo">演示单字符替换被检出</button>
    <span class="hint" data-i18n="cs_demo_hint">对 ORG-UNIQUE 改动一位（最后一个数据字符取反），校验应失败。</span>
    <span class="mono demo-result" id="demoResult"></span>
  </div>
  <p class="hint" id="algoNote"></p>
</section>

<script src="ui_i18n.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const T = (k) => OrpahI18n.t(k);
const CROCKFORD = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const CI = {};
for (let i = 0; i < CROCKFORD.length; i++) CI[CROCKFORD[i]] = i;

// 国家码列表（选项与右侧国名共用）。国名优先用浏览器 Intl.DisplayNames 按语言输出，
// 不可用时回退下面这份中文表。
const CC_LIST = ["CN", "US", "JP", "GB", "DE", "FR", "RU", "KR", "AU",
  "CA", "IN", "BR", "MX", "IT", "ES", "NL", "SE", "CH", "NO", "DK",
  "FI", "AT", "BE", "PT", "IE", "NZ", "SG", "TW", "HK", "MO"];
const CC_NAMES_ZH = { "CN": "中国", "US": "美国", "JP": "日本", "GB": "英国", "DE": "德国",
  "FR": "法国", "RU": "俄罗斯", "KR": "韩国", "AU": "澳大利亚", "CA": "加拿大", "IN": "印度",
  "BR": "巴西", "MX": "墨西哥", "IT": "意大利", "ES": "西班牙", "NL": "荷兰", "SE": "瑞典",
  "CH": "瑞士", "NO": "挪威", "DK": "丹麦", "FI": "芬兰", "AT": "奥地利", "BE": "比利时",
  "PT": "葡萄牙", "IE": "爱尔兰", "NZ": "新西兰", "SG": "新加坡", "TW": "中国台湾",
  "HK": "中国香港", "MO": "中国澳门" };
let ccDisp = null;
try {
  ccDisp = new Intl.DisplayNames(
    [OrpahI18n.lang === "en" ? "en" : "zh-Hans"], { type: "region" });
} catch (e) { /* 旧浏览器回退静态表 */ }
function ccName(code) {
  try {
    const n = ccDisp && ccDisp.of(code);
    if (n && n !== code) return n;
  } catch (e) { /* ignore */ }
  return CC_NAMES_ZH[code] || T("cc_unknown");
}
function fillCcList() {
  $("ccList").innerHTML = CC_LIST
    .map(c => `<option value="${c}">${ccName(c)}</option>`).join("");
}

/* ---- 算法全部走后端 /api/checksum（单一源：damm32.py / luhn32.py / mod97.py）---- */
async function apiChecksum(params) {
  try {
    return await fetch("/api/checksum?" + new URLSearchParams(params)).then(r => r.json());
  } catch (e) {
    console.error("checksum:", e);
    return { ok: false, err: T("cs_offline") };
  }
}

function validOrgUnique(s) {
  if (!s) return false;
  for (const ch of s) {
    if (ch === "-") continue;
    if (!(ch.toUpperCase() in CI)) return false;
  }
  return true;
}

const ALGO_NOTE = {
  damm32: T("cs_note_d32"),
  luhn32: T("cs_note_l32"),
  mod97: T("cs_note_m97"),
};
let activeAlgo = "damm32";

async function compute(org) {
  if (!validOrgUnique(org)) return null;
  const r = await apiChecksum({ action: "compute", algo: activeAlgo, org_unique: org });
  return r.ok ? { check: r.check, ok: r.valid } : null;
}

let reqSeq = 0;
async function refresh() {
  const my = ++reqSeq;
  const cc = document.getElementById("ccInput").value.trim().toUpperCase();
  const org = document.getElementById("orgUnique").value.trim().toUpperCase();
  document.getElementById("ccName").textContent = ccName(cc);
  const out = document.getElementById("checkOut"),
        full = document.getElementById("fullOut"),
        ver = document.getElementById("verifyOut");
  const r = await compute(org);
  if (my !== reqSeq) return;             // 丢弃过期响应（快速输入防乱序）
  if (!r) {
    out.textContent = T("cs_bad_input"); full.textContent = "-";
    ver.textContent = "-"; ver.className = "";
    return;
  }
  out.textContent = r.check;
  full.textContent = cc + "-" + org + "-" + r.check;
  ver.textContent = r.ok ? T("sg_ok") : T("sg_bad");
  ver.className = r.ok ? "ok" : "bad";
}

/* ---- 单字符替换演示（改 ORG-UNIQUE 末位） ---- */
document.getElementById("btnDemo").addEventListener("click", async () => {
  const cc = document.getElementById("ccInput").value.trim().toUpperCase();
  const org = document.getElementById("orgUnique").value.trim().toUpperCase();
  const r = await compute(org);
  const out = document.getElementById("demoResult");
  if (!r) { out.textContent = T("cs_bad_input"); return; }
  const idx = CROCKFORD.indexOf(org.slice(-1));
  const flipped = CROCKFORD[(Math.max(idx, 0) + 1) % 32];
  const badOrg = org.slice(0, -1) + flipped;
  const bad = await apiChecksum({ action: "verify", algo: activeAlgo,
                                  body: badOrg + "-" + r.check });
  const pass = T("cs_pass"), fail = T("cs_fail");
  out.textContent =
    T("cs_demo_orig").replace("{cc}", cc).replace("{org}", org)
      .replace("{chk}", r.check).replace("{r}", r.ok ? pass : fail) + "\n" +
    T("cs_demo_bad").replace("{cc}", cc).replace("{org}", badOrg)
      .replace("{chk}", r.check)
      .replace("{r}", bad.valid ? T("cs_pass_anom") : T("cs_fail_caught"));
});

/* ---- tab 切换 ---- */
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  activeAlgo = btn.dataset.algo;
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("active", t === btn));
  document.getElementById("algoNote").textContent = ALGO_NOTE[activeAlgo];
  document.getElementById("demoResult").textContent = "";
  refresh();
});

document.getElementById("orgUnique").addEventListener("input", refresh);
document.getElementById("ccInput").addEventListener("input", refresh);
document.getElementById("ccInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById("orgUnique").focus();
  }
});

document.getElementById("algoNote").textContent = ALGO_NOTE.damm32;
OrpahI18n.apply();
fillCcList();
refresh();
</script>
</body>
</html>
