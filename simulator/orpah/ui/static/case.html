<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>走失案件 — ORPAH-over-HaLow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260911c">
<style>
  .back { margin-left: 10px; }
  .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  table.case { border-collapse: collapse; width: 100%; margin-top: 12px; }
  table.case th, table.case td { padding: 6px 10px; text-align: left; font-size: 13px; vertical-align: top; }
  table.case th { color: var(--mut); font-weight: 400; border-bottom: 1px solid var(--bd); }
  table.case td { border-bottom: 1px solid #21262d; }
  .badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; border: 1px solid; display: inline-block; white-space: nowrap; }
  .c-open { color: var(--red); border-color: var(--red); }
  .c-found { color: var(--org); border-color: var(--org); }
  .c-closed { color: var(--grn); border-color: var(--grn); }
  .c-revoked { color: var(--mut); border-color: var(--mut); }
  .person-name { font-weight: 600; }
  .btn.sm { padding: 2px 8px; font-size: 12px; margin: 1px 0; }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.ok { color: var(--grn); border-color: var(--grn); }
  .ev-line { color: var(--mut); font-size: 12px; line-height: 1.6; }
  .devs { font-size: 12px; line-height: 1.6; }
  .hint.err { color: var(--red); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input, .toolbar select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 4px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .toolbar input { width: 210px; }
  .ev-toggle { color: var(--acc); border-color: var(--bd); }
  .row input {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .presults { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pitem {
    display: flex; gap: 8px; align-items: center;
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .pitem .pdev { color: var(--mut); font-size: 12px; }
  .pitem.sel { border-color: var(--acc); color: var(--acc); }
  .pitem:hover { border-color: var(--acc); }
  .pavatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #30363d; }
  .pavatar.noimg { display: flex; align-items: center; justify-content: center; color: var(--txt); font-size: 13px; }
  .pmeta { color: var(--mut); font-size: 12px; }
  .subhead { margin: 12px 0 6px; font-size: 13px; color: var(--mut); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-width: 760px; }
  .grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mut); }
  .grid input {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .pcard { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .pcard .pbig { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #30363d; }
  .pcard .pbig.noimg { display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .pcard .pc-info { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .pcard .pc-meta { color: var(--mut); font-size: 12px; }
  tr.detail td { background: #0d1117; }
  .detail-grid { display: flex; gap: 20px; flex-wrap: wrap; }
  .dsec h5 { margin: 0 0 6px; color: var(--mut); font-weight: 400; font-size: 13px; }
  .dv { margin: 2px 0; font-size: 13px; }
  .dv b { color: var(--mut); font-weight: 400; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a href="index.html" title="返回主页"><img class="brand-logo" src="orpah-logo.png" alt="orpah"></a>
    <span class="brand-name">走失案件</span>
    <span class="sub">Orpah ID · 以人为单位：立案 → 发现 → 找回/撤销 → 结案</span>
    <a class="btn back" href="registry.html">设备清册</a>
    <a class="btn back" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="card">
  <h3>1 · 立案</h3>
  <div class="row">
    <label>人员 <input id="personQ" placeholder="搜索编号 / 名称…" spellcheck="false"></label>
    <span class="hint" id="personSel">未选择人员</span>
  </div>
  <div class="presults" id="personResults"></div>
  <div id="personCard" class="pcard"></div>
  <h4 class="subhead">走失信息（寻人启事要素）</h4>
  <div class="grid">
    <label>走失时间 <input id="cMissingAt" placeholder="如 2026-09-11 15:00 左右"></label>
    <label>走失地点 <input id="cMissingPlace" placeholder="如 XX市XX区XX路"></label>
    <label>可能去向 <input id="cPossibleTo" placeholder="如 沿XX路向南"></label>
    <label>衣着描述 <input id="cClothing" placeholder="如 红色外套、蓝色牛仔裤"></label>
    <label>家属电话 <input id="cPhone" placeholder="如 13800000000"></label>
    <label>警方联系人 <input id="cPolice" placeholder="如 XX派出所 王警官"></label>
    <label>案件编号 <input id="cCaseNo" placeholder="如 20260911001"></label>
    <label>受理单位 <input id="cStation" placeholder="如 XX派出所"></label>
    <label>携带物品 <input id="cBelongings" placeholder="如 黑色背包"></label>
    <label>交通工具 <input id="cVehicle" placeholder="如 未携带 / 车牌"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="btnMark">标记走失 / 立案</button>
    <span class="hint" id="markHint"></span>
  </div>
  <p class="hint">立案后：该人员名下<b>所有设备</b>进入「丢失」态并标记走失；任一台被路由器发现即视为发现该人。</p>
</section>

<section class="card">
  <h3>2 · 案件列表</h3>
  <div class="toolbar">
    <input id="cq" placeholder="搜索案件号 / 走失者…" spellcheck="false">
    <select id="cStatus">
      <option value="">全部状态</option>
      <option value="open">走失中</option>
      <option value="found">已发现</option>
      <option value="closed">已找回</option>
      <option value="revoked">已撤销</option>
    </select>
  </div>
  <table class="case">
    <thead><tr>
      <th>案件号</th><th>走失者</th><th>状态</th><th>设备</th><th>事件</th><th>操作</th>
    </tr></thead>
    <tbody id="caseBody"></tbody>
  </table>
  <p class="hint" id="caseEmpty">暂无案件。选择走失者立案。</p>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const CASE_ZH = { open: "走失中", found: "已发现", closed: "已找回", revoked: "已撤销" };
const EV_ZH = { mark: "立案", found: "发现", close: "结案" };

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function fmtT(ts) {
  if (ts === null || ts === undefined) return "—";
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  const mmdd = `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const hms = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const dayDiff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (dayDiff <= 0) return hms;
  if (dayDiff === 1) return `${mmdd} ${hms} · 昨天`;
  return `${mmdd} ${hms} · ${dayDiff}天前`;
}
async function api(body) {
  let r;
  try {
    const resp = await fetch("/api/cases", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    r = await resp.json();
  } catch (e) {
    console.error("cases:", e);
    alert("操作失败：无法连接服务器，请检查网络/服务是否在线");
    return { ok: false };
  }
  if (!r.ok) {
    console.error("cases:", r.err);
    alert("操作失败：" + (r.err || "未知错误"));
  }
  return r;
}

let registry = { persons: [], devices: [] };
let casesData = { cases: [] };
let expanded = new Set();
let detailExpanded = new Set();
let selectedPid = null;

function updateSel() {
  const p = registry.persons.find(x => x.pid === selectedPid);
  $("personSel").textContent = p ? `已选：${p.name}（${p.pid}）` : "未选择人员";
  const card = $("personCard");
  if (!p) { card.innerHTML = ""; return; }
  const ava = p.photo
    ? `<img class="pbig" src="${esc(p.photo)}" alt="">`
    : `<span class="pbig noimg">${esc((p.name || "?").charAt(0))}</span>`;
  const meta = [
    ["性别", p.gender], ["年龄", p.age ? p.age + "岁" : ""],
    ["身高", p.height], ["体重/体型", p.build],
    ["体貌特征", p.features], ["疾病/健康", p.health],
    ["精神状态", p.mental], ["沟通能力", p.communicate],
  ].filter(([, v]) => v).map(([k, v]) => `${k}：${esc(v)}`).join(" · ");
  card.innerHTML = `${ava}<div class="pc-info">
    <span class="person-name">${esc(p.name)} <span class="mono">${esc(p.pid)}</span></span>
    <span class="pc-meta">${meta || "暂无更多信息"}</span>
  </div>`;
}

function renderPersonResults() {
  updateSel();
  const q = ($("personQ").value || "").trim().toLowerCase();
  const box = $("personResults");
  if (!q) { box.innerHTML = ""; return; }
  const hits = registry.persons.filter(p =>
    p.pid.toLowerCase().includes(q) || (p.name || "").toLowerCase().includes(q)
  ).slice(0, 20);
  box.innerHTML = hits.length
    ? hits.map(p => {
        const cnt = registry.devices.filter(d => d.person_id === p.pid).length;
        const cls = p.pid === selectedPid ? "pitem sel" : "pitem";
        const ava = p.photo
          ? `<img class="pavatar" src="${esc(p.photo)}" alt="">`
          : `<span class="pavatar noimg">${esc((p.name || "?").charAt(0))}</span>`;
        const meta = [p.gender, p.age ? `${p.age}岁` : ""].filter(Boolean).join(" · ");
        return `<button class="${cls}" data-pid="${esc(p.pid)}">
          ${ava}
          <span class="person-name">${esc(p.name)}</span>
          <span class="mono">${esc(p.pid)}</span>
          <span class="pmeta">${esc(meta || "")}</span>
          <span class="pdev">${cnt} 台设备</span>
        </button>`;
      }).join("")
    : '<span class="hint">无匹配人员</span>';
  box.querySelectorAll("button[data-pid]").forEach(b => {
    b.onclick = () => { selectedPid = b.dataset.pid; renderPersonResults(); };
  });
}

function eventLine(e) {
  const label = EV_ZH[e.type] || e.type;
  if (e.type === "mark") return `${fmtT(e.t)} · ${label}（设备 ${esc(e.sn)}）`;
  if (e.type === "found") return `${fmtT(e.t)} · ${label} SN ${esc(e.sn)}${e.detail ? " · " + esc(e.detail) : ""}`;
  if (e.type === "close") return `${fmtT(e.t)} · ${label}（${e.detail === "revoked" ? "撤销" : "找回"}，设备 ${esc(e.sn)}）`;
  return `${fmtT(e.t)} · ${label} ${esc(e.sn || "")}`;
}

function caseDetailHtml(c) {
  const p = registry.persons.find(x => x.pid === c.person_id);
  const caseFields = [
    ["走失时间", c.missing_at], ["走失地点", c.missing_place],
    ["可能去向", c.possible_to], ["衣着描述", c.clothing],
    ["家属电话", c.contact_phone], ["警方联系人", c.police],
    ["案件编号", c.police_case_no], ["受理单位", c.police_station],
    ["携带物品", c.belongings], ["交通工具", c.vehicle],
  ].filter(([, v]) => v);
  const personFields = p ? [
    ["身高", p.height], ["体重/体型", p.build], ["体貌特征", p.features],
    ["疾病/健康", p.health], ["精神状态", p.mental], ["沟通能力", p.communicate],
  ].filter(([, v]) => v) : [];
  const dl = arr => arr.map(([k, v]) => `<div class="dv"><b>${esc(k)}</b>${esc(v)}</div>`).join("");
  const psec = personFields.length ? `<div class="dsec"><h5>人员档案</h5>${dl(personFields)}</div>` : "";
  const csec = caseFields.length ? `<div class="dsec"><h5>走失信息</h5>${dl(caseFields)}</div>` : "";
  return `<div class="detail-grid">${psec}${csec}${(!psec && !csec) ? '<span class="hint">无补充信息</span>' : ""}</div>`;
}

function render() {
  // 人员搜索 + 选中展示
  renderPersonResults();

  const tbody = $("caseBody");
  const q = ($("cq").value || "").trim().toLowerCase();
  const fs = $("cStatus").value;
  const all = casesData.cases || [];
  const cs = all.filter(c => {
    if (fs && c.status !== fs) return false;
    if (q) {
      const cid = (c.case_id || "").toLowerCase();
      const name = (c.person_name || "").toLowerCase();
      if (!cid.includes(q) && !name.includes(q)) return false;
    }
    return true;
  });
  const emptyEl = $("caseEmpty");
  if (!all.length) { emptyEl.textContent = "暂无案件。搜索并选择人员立案。"; emptyEl.style.display = ""; }
  else if (!cs.length) { emptyEl.textContent = "无匹配案件。"; emptyEl.style.display = ""; }
  else emptyEl.style.display = "none";

  tbody.innerHTML = cs.map(c => {
    const evs = c.events || [];
    const isOpen = expanded.has(c.case_id) || evs.length <= 8;
    const evLines = evs.slice(isOpen ? 0 : -8).map(eventLine).join("<br>");
    let evHtml = evLines || "—";
    if (evs.length > 8) {
      evHtml += `<br><button class="btn sm ev-toggle" data-act="toggle" data-cid="${esc(c.case_id)}">${isOpen ? "收起" : `查看全部（${evs.length} 条）`}</button>`;
    }
    let ops = `<button class="btn sm" data-act="detail">${detailExpanded.has(c.case_id) ? "收起详情" : "详情"}</button>`;
    if (c.status === "open" || c.status === "found") {
      ops += `<button class="btn sm ok" data-act="close" data-outcome="closed">找回（结案）</button>
              <button class="btn sm danger" data-act="close" data-outcome="revoked">撤销（误报）</button>`;
    } else {
      ops += `<span class="ev-line">${c.outcome === "revoked" ? "误报撤销" : "已找回"} · ${fmtT(c.closed_at)}</span>`;
    }
    const devs = (c.devices || []).map(s => esc(s)).join("<br>") || "—";
    const main = `<tr data-cid="${esc(c.case_id)}">
      <td class="mono">${esc(c.case_id)}</td>
      <td class="person-name">${esc(c.person_name)}</td>
      <td><span class="badge c-${esc(c.status)}">${CASE_ZH[c.status] || c.status}</span></td>
      <td class="mono devs">${devs}</td>
      <td class="ev-line">${evHtml}</td>
      <td>${ops}</td>
    </tr>`;
    const detail = detailExpanded.has(c.case_id)
      ? `<tr class="detail"><td colspan="6">${caseDetailHtml(c)}</td></tr>`
      : "";
    return main + detail;
  }).join("");

  tbody.querySelectorAll("button[data-act='close']").forEach(b => {
    b.onclick = async () => {
      const cid = b.closest("tr").dataset.cid;
      const outcome = b.dataset.outcome;
      const label = outcome === "revoked" ? "撤销误报" : "找回";
      if (!confirm(`确认「${label}」该案件？名下设备将恢复启用。`)) return;
      await api({ action: "close", case_id: cid, outcome });
      load();
    };
  });
  tbody.querySelectorAll("button[data-act='toggle']").forEach(b => {
    b.onclick = () => {
      const cid = b.dataset.cid;
      if (expanded.has(cid)) expanded.delete(cid); else expanded.add(cid);
      render();
    };
  });
  tbody.querySelectorAll("button[data-act='detail']").forEach(b => {
    b.onclick = () => {
      const cid = b.closest("tr").dataset.cid;
      if (detailExpanded.has(cid)) detailExpanded.delete(cid); else detailExpanded.add(cid);
      render();
    };
  });
}

async function load() {
  try {
    const [r1, r2] = await Promise.all([
      fetch("/api/registry").then(r => r.json()),
      fetch("/api/cases").then(r => r.json()),
    ]);
    if (r1 && r1.persons) registry = r1;
    if (r2 && r2.cases) casesData = r2;
    render();
  } catch (e) {
    console.error("load failed", e);
  }
}
async function schedule() {
  await load();
  setTimeout(schedule, 1000);
}

$("btnMark").onclick = async () => {
  const pid = selectedPid;
  const hint = $("markHint");
  if (!pid) { hint.textContent = "请先搜索并选择人员"; hint.className = "hint err"; return; }
  const cnt = registry.devices.filter(d => d.person_id === pid).length;
  if (cnt === 0) {
    hint.textContent = "该人员名下无绑定设备，无法立案（请先在设备清册绑定设备）";
    hint.className = "hint err";
    return;
  }
  hint.textContent = ""; hint.className = "hint";
  const r = await api({ action: "mark", person_id: pid,
    missing_at: $("cMissingAt").value.trim(),
    missing_place: $("cMissingPlace").value.trim(),
    possible_to: $("cPossibleTo").value.trim(),
    clothing: $("cClothing").value.trim(),
    contact_phone: $("cPhone").value.trim(),
    police: $("cPolice").value.trim(),
    police_case_no: $("cCaseNo").value.trim(),
    police_station: $("cStation").value.trim(),
    belongings: $("cBelongings").value.trim(),
    vehicle: $("cVehicle").value.trim(),
  });
  if (r.ok && r.dup) alert("该人员已有未结案件");
  ["cMissingAt", "cMissingPlace", "cPossibleTo", "cClothing", "cPhone",
   "cPolice", "cCaseNo", "cStation", "cBelongings", "cVehicle"].forEach(id => $(id).value = "");
  load();
};

$("cq").oninput = () => render();
$("cStatus").onchange = () => render();
$("personQ").oninput = () => renderPersonResults();

schedule();
</script>
</body>
</html>
