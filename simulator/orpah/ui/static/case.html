<!DOCTYPE html>
<html lang="zh-CN" data-i18n-doc-title="doc_case">
<head>
<meta charset="utf-8">
<title>走失案件 — ORPAH-over-HaLow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260911c">
<style>
  .back { margin-left: 10px; }
  .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  table.case { border-collapse: collapse; width: 100%; margin-top: 12px; }
  table.case th, table.case td { padding: 6px 10px; text-align: left; font-size: 13px; vertical-align: top; }
  table.case th { color: var(--mut); font-weight: 400; border-bottom: 1px solid var(--bd); }
  table.case td { border-bottom: 1px solid #21262d; }
  .badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; border: 1px solid; display: inline-block; white-space: nowrap; }
  .c-open { color: var(--red); border-color: var(--red); }
  .c-found { color: var(--org); border-color: var(--org); }
  .c-closed { color: var(--grn); border-color: var(--grn); }
  .c-revoked { color: var(--mut); border-color: var(--mut); }
  .person-name { font-weight: 600; }
  .btn.sm { padding: 2px 8px; font-size: 12px; margin: 1px 0; }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.ok { color: var(--grn); border-color: var(--grn); }
  .ev-line { color: var(--mut); font-size: 12px; line-height: 1.6; }
  .devs { font-size: 12px; line-height: 1.6; }
  .hint.err { color: var(--red); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input, .toolbar select {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 4px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .toolbar input { width: 210px; }
  .ev-toggle { color: var(--acc); border-color: var(--bd); }
  .row input {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .presults { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pitem {
    display: flex; gap: 8px; align-items: center;
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .pitem .pdev { color: var(--mut); font-size: 12px; }
  .pitem.sel { border-color: var(--acc); color: var(--acc); }
  .pitem:hover { border-color: var(--acc); }
  .pavatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #30363d; }
  .pavatar.noimg { display: flex; align-items: center; justify-content: center; color: var(--txt); font-size: 13px; }
  .pmeta { color: var(--mut); font-size: 12px; }
  .subhead { margin: 12px 0 6px; font-size: 13px; color: var(--mut); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-width: 760px; }
  .grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mut); }
  .grid input {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .pcard { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .pcard .pbig { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #30363d; }
  .pcard .pbig.noimg { display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .pcard .pc-info { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .pcard .pc-meta { color: var(--mut); font-size: 12px; }
  tr.detail td { background: #0d1117; }
  .detail-grid { display: flex; gap: 20px; flex-wrap: wrap; }
  .dsec h5 { margin: 0 0 6px; color: var(--mut); font-weight: 400; font-size: 13px; }
  .dv { margin: 2px 0; font-size: 13px; }
  .dv b { color: var(--mut); font-weight: 400; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a href="index.html" data-i18n-title="nav_home_title" title="返回主页"><img class="brand-logo" src="orpah-logo.png" alt="orpah"></a>
    <span class="brand-name" data-i18n="nav_case">走失案件</span>
    <span class="sub" data-i18n="case_sub">Orpah ID · 以人为单位：立案 → 发现 → 找回/撤销 → 结案</span>
    <a class="btn back" href="registry.html" data-i18n="nav_registry">设备清册</a>
    <a class="btn back" href="index.html" data-i18n="nav_home">← 返回主页</a>
    <button class="btn" id="langBtn" title="中文 / English"></button>
  </div>
</header>

<section class="card">
  <h3 data-i18n="case_sec1">1 · 立案</h3>
  <div class="row">
    <label><span data-i18n="case_person">人员</span> <input id="personQ" data-i18n-ph="case_ph_person" placeholder="搜索编号 / 名称…" spellcheck="false"></label>
    <span class="hint" id="personSel" data-i18n="case_no_person">未选择人员</span>
  </div>
  <div class="presults" id="personResults"></div>
  <div id="personCard" class="pcard"></div>
  <h4 class="subhead" data-i18n="case_missing_head">走失信息（寻人启事要素）</h4>
  <div class="grid">
    <label><span data-i18n="case_f_at">走失时间</span> <input id="cMissingAt" data-i18n-ph="case_ph_at" placeholder="如 2026-09-11 15:00 左右"></label>
    <label><span data-i18n="case_f_place">走失地点</span> <input id="cMissingPlace" data-i18n-ph="case_ph_place" placeholder="如 XX市XX区XX路"></label>
    <label><span data-i18n="case_f_to">可能去向</span> <input id="cPossibleTo" data-i18n-ph="case_ph_to" placeholder="如 沿XX路向南"></label>
    <label><span data-i18n="case_f_cloth">衣着描述</span> <input id="cClothing" data-i18n-ph="case_ph_cloth" placeholder="如 红色外套、蓝色牛仔裤"></label>
    <label><span data-i18n="case_f_phone">家属电话</span> <input id="cPhone" data-i18n-ph="case_ph_phone" placeholder="如 13800000000"></label>
    <label><span data-i18n="case_f_police">警方联系人</span> <input id="cPolice" data-i18n-ph="case_ph_police" placeholder="如 XX派出所 王警官"></label>
    <label><span data-i18n="case_f_caseno">案件编号</span> <input id="cCaseNo" data-i18n-ph="case_ph_caseno" placeholder="如 20260911001"></label>
    <label><span data-i18n="case_f_station">受理单位</span> <input id="cStation" data-i18n-ph="case_ph_station" placeholder="如 XX派出所"></label>
    <label><span data-i18n="case_f_belong">携带物品</span> <input id="cBelongings" data-i18n-ph="case_ph_belong" placeholder="如 黑色背包"></label>
    <label><span data-i18n="case_f_vehicle">交通工具</span> <input id="cVehicle" data-i18n-ph="case_ph_vehicle" placeholder="如 未携带 / 车牌"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="btnMark" data-i18n="case_btn_mark">标记走失 / 立案</button>
    <span class="hint" id="markHint"></span>
  </div>
  <p class="hint"><span data-i18n="case_hint_a">立案后：该人员名下</span><b data-i18n="case_hint_b">所有设备</b><span data-i18n="case_hint_c">进入「丢失」态并标记走失；任一台被路由器发现即视为发现该人。</span></p>
</section>

<section class="card">
  <h3 data-i18n="case_sec2">2 · 案件列表</h3>
  <div class="toolbar">
    <input id="cq" data-i18n-ph="case_ph_search" placeholder="搜索案件号 / 走失者…" spellcheck="false">
    <select id="cStatus">
      <option value="" data-i18n="case_opt_all">全部状态</option>
      <option value="open" data-i18n="case_st_open">走失中</option>
      <option value="found" data-i18n="case_st_found">已发现</option>
      <option value="closed" data-i18n="case_st_closed">已找回</option>
      <option value="revoked" data-i18n="case_st_revoked">已撤销</option>
    </select>
  </div>
  <table class="case">
    <thead><tr>
      <th data-i18n="case_th_id">案件号</th><th data-i18n="case_th_person">走失者</th><th data-i18n="case_th_status">状态</th><th data-i18n="case_th_dev">设备</th><th data-i18n="case_th_ev">事件</th><th data-i18n="case_th_ops">操作</th>
    </tr></thead>
    <tbody id="caseBody"></tbody>
  </table>
  <p class="hint" id="caseEmpty"></p>
</section>

<script src="ui_i18n.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const T = (k) => OrpahI18n.t(k);
// 案件状态 / 事件类型展示标签（机器值不变，只翻展示）
const CASE_LBL = {
  open: T("case_st_open"), found: T("case_st_found"),
  closed: T("case_st_closed"), revoked: T("case_st_revoked"),
};
const EV_LBL = { mark: T("ev_mark"), found: T("ev_found"), close: T("ev_close") };
const GL = { "男": T("g_m"), "女": T("g_f") };
const genderLabel = (v) => GL[v] || v;
const yrs = (a) => a ? T("case_years").replace("{n}", a) : "";

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function fmtT(ts) {
  if (ts === null || ts === undefined) return "—";
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  const mmdd = `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const hms = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const dayDiff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (dayDiff <= 0) return hms;
  if (dayDiff === 1) return `${mmdd} ${hms} · ${T("t_yesterday")}`;
  return `${mmdd} ${hms} · ${T("t_days_ago").replace("{n}", dayDiff)}`;
}
async function api(body) {
  let r;
  try {
    const resp = await fetch("/api/cases", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    r = await resp.json();
  } catch (e) {
    console.error("cases:", e);
    alert(T("err_offline"));
    return { ok: false };
  }
  if (!r.ok) {
    console.error("cases:", r.err);
    alert(T("err_prefix") + (r.err || T("err_unknown")));
  }
  return r;
}

let registry = { persons: [], devices: [] };
let casesData = { cases: [] };
let expanded = new Set();
let detailExpanded = new Set();
let selectedPid = null;

function updateSel() {
  const p = registry.persons.find(x => x.pid === selectedPid);
  $("personSel").textContent = p
    ? T("case_sel_prefix") + `${p.name}（${p.pid}）`
    : T("case_no_person");
  const card = $("personCard");
  if (!p) { card.innerHTML = ""; return; }
  const ava = p.photo
    ? `<img class="pbig" src="${esc(p.photo)}" alt="">`
    : `<span class="pbig noimg">${esc((p.name || "?").charAt(0))}</span>`;
  const meta = [
    [T("f_gender"), p.gender ? genderLabel(p.gender) : ""],
    [T("f_age"), yrs(p.age)],
    [T("f_height"), p.height], [T("f_build"), p.build],
    [T("f_features"), p.features], [T("f_health"), p.health],
    [T("f_mental"), p.mental], [T("f_comm"), p.communicate],
  ].filter(([, v]) => v).map(([k, v]) => `${k}：${esc(v)}`).join(" · ");
  card.innerHTML = `${ava}<div class="pc-info">
    <span class="person-name">${esc(p.name)} <span class="mono">${esc(p.pid)}</span></span>
    <span class="pc-meta">${meta || T("case_no_extra")}</span>
  </div>`;
}

function renderPersonResults() {
  updateSel();
  const q = ($("personQ").value || "").trim().toLowerCase();
  const box = $("personResults");
  if (!q) { box.innerHTML = ""; return; }
  const hits = registry.persons.filter(p =>
    p.pid.toLowerCase().includes(q) || (p.name || "").toLowerCase().includes(q)
  ).slice(0, 20);
  box.innerHTML = hits.length
    ? hits.map(p => {
        const cnt = registry.devices.filter(d => d.person_id === p.pid).length;
        const cls = p.pid === selectedPid ? "pitem sel" : "pitem";
        const ava = p.photo
          ? `<img class="pavatar" src="${esc(p.photo)}" alt="">`
          : `<span class="pavatar noimg">${esc((p.name || "?").charAt(0))}</span>`;
        const meta = [p.gender ? genderLabel(p.gender) : "", yrs(p.age)]
          .filter(Boolean).join(" · ");
        return `<button class="${cls}" data-pid="${esc(p.pid)}">
          ${ava}
          <span class="person-name">${esc(p.name)}</span>
          <span class="mono">${esc(p.pid)}</span>
          <span class="pmeta">${esc(meta || "")}</span>
          <span class="pdev">${esc(T("case_ndev").replace("{n}", cnt))}</span>
        </button>`;
      }).join("")
    : `<span class="hint">${esc(T("case_no_match_person"))}</span>`;
  box.querySelectorAll("button[data-pid]").forEach(b => {
    b.onclick = () => { selectedPid = b.dataset.pid; renderPersonResults(); };
  });
}

function eventLine(e) {
  const label = EV_LBL[e.type] || e.type;
  const dev = T("case_ev_device");
  if (e.type === "mark") return `${fmtT(e.t)} · ${label}（${dev.replace("{sn}", esc(e.sn))}）`;
  if (e.type === "found") return `${fmtT(e.t)} · ${label} SN ${esc(e.sn)}${e.detail ? " · " + esc(e.detail) : ""}`;
  if (e.type === "close") {
    const how = e.detail === "revoked" ? T("case_out_revoked") : T("case_out_recovered");
    return `${fmtT(e.t)} · ${label}（${how}，${dev.replace("{sn}", esc(e.sn))}）`;
  }
  return `${fmtT(e.t)} · ${label} ${esc(e.sn || "")}`;
}

function caseDetailHtml(c) {
  const p = registry.persons.find(x => x.pid === c.person_id);
  const caseFields = [
    [T("case_f_at"), c.missing_at], [T("case_f_place"), c.missing_place],
    [T("case_f_to"), c.possible_to], [T("case_f_cloth"), c.clothing],
    [T("case_f_phone"), c.contact_phone], [T("case_f_police"), c.police],
    [T("case_f_caseno"), c.police_case_no], [T("case_f_station"), c.police_station],
    [T("case_f_belong"), c.belongings], [T("case_f_vehicle"), c.vehicle],
  ].filter(([, v]) => v);
  const personFields = p ? [
    [T("f_height"), p.height], [T("f_build"), p.build],
    [T("f_features"), p.features],
    [T("f_health"), p.health], [T("f_mental"), p.mental], [T("f_comm"), p.communicate],
  ].filter(([, v]) => v) : [];
  const dl = arr => arr.map(([k, v]) => `<div class="dv"><b>${esc(k)}</b>${esc(v)}</div>`).join("");
  const psec = personFields.length ? `<div class="dsec"><h5>${esc(T("case_sec_person"))}</h5>${dl(personFields)}</div>` : "";
  const csec = caseFields.length ? `<div class="dsec"><h5>${esc(T("case_sec_missing"))}</h5>${dl(caseFields)}</div>` : "";
  return `<div class="detail-grid">${psec}${csec}${(!psec && !csec) ? `<span class="hint">${esc(T("case_no_extra"))}</span>` : ""}</div>`;
}

function render() {
  // 人员搜索 + 选中展示
  renderPersonResults();

  const tbody = $("caseBody");
  const q = ($("cq").value || "").trim().toLowerCase();
  const fs = $("cStatus").value;
  const all = casesData.cases || [];
  const cs = all.filter(c => {
    if (fs && c.status !== fs) return false;
    if (q) {
      const cid = (c.case_id || "").toLowerCase();
      const name = (c.person_name || "").toLowerCase();
      if (!cid.includes(q) && !name.includes(q)) return false;
    }
    return true;
  });
  const emptyEl = $("caseEmpty");
  if (!all.length) { emptyEl.textContent = T("case_empty_new2"); emptyEl.style.display = ""; }
  else if (!cs.length) { emptyEl.textContent = T("case_empty_none"); emptyEl.style.display = ""; }
  else emptyEl.style.display = "none";

  tbody.innerHTML = cs.map(c => {
    const evs = c.events || [];
    const isOpen = expanded.has(c.case_id) || evs.length <= 8;
    const evLines = evs.slice(isOpen ? 0 : -8).map(eventLine).join("<br>");
    let evHtml = evLines || "—";
    if (evs.length > 8) {
      evHtml += `<br><button class="btn sm ev-toggle" data-act="toggle" data-cid="${esc(c.case_id)}">${isOpen ? esc(T("case_btn_toggle_collapse")) : esc(T("case_btn_toggle_all").replace("{n}", evs.length))}</button>`;
    }
    let ops = `<button class="btn sm" data-act="detail">${esc(detailExpanded.has(c.case_id) ? T("case_btn_detail_hide") : T("case_btn_detail"))}</button>`;
    if (c.status === "open" || c.status === "found") {
      ops += `<button class="btn sm ok" data-act="close" data-outcome="closed">${esc(T("case_btn_close_found"))}</button>
              <button class="btn sm danger" data-act="close" data-outcome="revoked">${esc(T("case_btn_close_revoke"))}</button>`;
    } else {
      ops += `<span class="ev-line">${esc(c.outcome === "revoked" ? T("case_out_revoked") : T("case_out_recovered"))} · ${fmtT(c.closed_at)}</span>`;
    }
    const devs = (c.devices || []).map(s => esc(s)).join("<br>") || "—";
    const main = `<tr data-cid="${esc(c.case_id)}">
      <td class="mono">${esc(c.case_id)}</td>
      <td class="person-name">${esc(c.person_name)}</td>
      <td><span class="badge c-${esc(c.status)}">${esc(CASE_LBL[c.status] || c.status)}</span></td>
      <td class="mono devs">${devs}</td>
      <td class="ev-line">${evHtml}</td>
      <td>${ops}</td>
    </tr>`;
    const detail = detailExpanded.has(c.case_id)
      ? `<tr class="detail"><td colspan="6">${caseDetailHtml(c)}</td></tr>`
      : "";
    return main + detail;
  }).join("");

  tbody.querySelectorAll("button[data-act='close']").forEach(b => {
    b.onclick = async () => {
      const cid = b.closest("tr").dataset.cid;
      const outcome = b.dataset.outcome;
      const label = outcome === "revoked" ? T("case_lbl_revoke") : T("case_lbl_found");
      if (!confirm(T("case_confirm_close").replace("{label}", label))) return;
      await api({ action: "close", case_id: cid, outcome });
      load();
    };
  });
  tbody.querySelectorAll("button[data-act='toggle']").forEach(b => {
    b.onclick = () => {
      const cid = b.dataset.cid;
      if (expanded.has(cid)) expanded.delete(cid); else expanded.add(cid);
      render();
    };
  });
  tbody.querySelectorAll("button[data-act='detail']").forEach(b => {
    b.onclick = () => {
      const cid = b.closest("tr").dataset.cid;
      if (detailExpanded.has(cid)) detailExpanded.delete(cid); else detailExpanded.add(cid);
      render();
    };
  });
}

async function load() {
  try {
    const [r1, r2] = await Promise.all([
      fetch("/api/registry").then(r => r.json()),
      fetch("/api/cases").then(r => r.json()),
    ]);
    if (r1 && r1.persons) registry = r1;
    if (r2 && r2.cases) casesData = r2;
    render();
  } catch (e) {
    console.error("load failed", e);
  }
}
async function schedule() {
  await load();
  setTimeout(schedule, 1000);
}

$("btnMark").onclick = async () => {
  const pid = selectedPid;
  const hint = $("markHint");
  if (!pid) { hint.textContent = T("case_hint_pick"); hint.className = "hint err"; return; }
  const cnt = registry.devices.filter(d => d.person_id === pid).length;
  if (cnt === 0) {
    hint.textContent = T("case_hint_nodev");
    hint.className = "hint err";
    return;
  }
  hint.textContent = ""; hint.className = "hint";
  const r = await api({ action: "mark", person_id: pid,
    missing_at: $("cMissingAt").value.trim(),
    missing_place: $("cMissingPlace").value.trim(),
    possible_to: $("cPossibleTo").value.trim(),
    clothing: $("cClothing").value.trim(),
    contact_phone: $("cPhone").value.trim(),
    police: $("cPolice").value.trim(),
    police_case_no: $("cCaseNo").value.trim(),
    police_station: $("cStation").value.trim(),
    belongings: $("cBelongings").value.trim(),
    vehicle: $("cVehicle").value.trim(),
  });
  if (r.ok && r.dup) alert(T("case_dup"));
  ["cMissingAt", "cMissingPlace", "cPossibleTo", "cClothing", "cPhone",
   "cPolice", "cCaseNo", "cStation", "cBelongings", "cVehicle"].forEach(id => $(id).value = "");
  load();
};

$("cq").oninput = () => render();
$("cStatus").onchange = () => render();
$("personQ").oninput = () => renderPersonResults();

OrpahI18n.apply();
schedule();
</script>
</body>
</html>
