<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ORPAH-over-HaLow L1 演示</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260909c">
</head>
<body>
<header>
  <div class="brand"><img class="brand-logo" src="orpah-logo.png" alt="orpah" title="orpah"> <span class="brand-name">ORPAH-over-HaLow</span> <span class="sub" data-i18n="brand_sub">L1 数据通路演示 · 纯软件模拟器</span></div>
  <div class="tools">
    <span id="srvstatus" class="badge">--</span>
    <button id="btnPause" class="btn" data-i18n="btn_pause">暂停上报</button>
    <button id="btnReset" class="btn" data-i18n="btn_clear">清空列表</button>
  </div>
</header>

<!-- ============ 拓扑（3 节点：客户端 / 路由器 / 服务器） ============ -->
<section id="topology" class="card">
  <div class="topo">
    <div class="node" id="nodeClient">
      <div class="node-title"><span data-i18n="node_client">客户端</span><span class="chip" id="chipClient">--</span></div>
      <div class="node-row small" data-i18n="sub_client">主机 · 组 ORPAH-REPORT</div>
      <div class="node-row"><span data-i18n="lbl_sn">序列号</span> <b id="snClient">-</b></div>
      <div class="node-row" id="rowClientCnt"></div>
      <div class="node-row small"><span data-i18n="lbl_air">空口</span> <span data-i18n="lbl_tx">发送</span> <span id="txSTA">0</span> · <span data-i18n="lbl_rx">接收</span> <span id="rxSTA">0</span></div>
    </div>
    <div class="link"><div class="flow"><span></span><span></span><span></span></div><div class="link-label" data-i18n="link_air">HaLow 虚拟空口</div></div>
    <div class="node" id="nodeRouter">
      <div class="node-title"><span data-i18n="node_router">路由器</span><span class="chip" id="chipRouter">--</span></div>
      <div class="node-row small" data-i18n="sub_router">空口收 · UDP 上行</div>
      <div class="node-row" id="rowRouterCnt"></div>
      <div class="node-row small"><span data-i18n="lbl_air">空口</span> <span data-i18n="lbl_tx">发送</span> <span id="txAP">0</span> · <span data-i18n="lbl_rx">接收</span> <span id="rxAP">0</span></div>
    </div>
    <div class="link"><div class="flow center"><span></span><span></span><span></span></div><div class="link-label" data-i18n="link_udp">UDP :19447</div></div>
    <div class="node" id="nodeServer">
      <div class="node-title"><span data-i18n="node_server">服务器</span><span class="chip" id="chipServer">--</span></div>
      <div class="node-row small" data-i18n="sub_server">Python UDP</div>
      <div class="node-row" id="rowServerCnt"></div>
    </div>
  </div>
</section>

<!-- ============ 报文流 ============ -->
<section class="card" id="msgsec">
  <h3 data-i18n="msg_title">ORPAH-REPORT 实时报文流</h3>
  <table id="msgTable">
    <thead><tr>
      <th data-i18n="th_time">时间</th><th data-i18n="th_seq">序号</th>
      <th data-i18n="th_sn">序列号</th><th data-i18n="th_rssi">信号</th>
      <th data-i18n="th_client">客户端注入</th><th data-i18n="th_router">路由器上行</th>
      <th data-i18n="th_server">服务器收到</th>
    </tr></thead>
    <tbody id="msgList"></tbody>
  </table>
</section>

<!-- ============ 控制 ============ -->
<section class="card" id="ctlsec">
  <h3 data-i18n="ctl_title">上报控制</h3>
  <div class="config-row">
    <label><span data-i18n="ctl_every">间隔</span> <input id="ctlEvery" type="number" value="2" min="0.3" step="0.1"> <span data-i18n="ctl_sec">秒</span></label>
    <label><span data-i18n="ctl_sn">序列号</span> <input id="ctlSn" value="ORPAH-0001"></label>
    <button class="btn primary" id="btnApply" data-i18n="btn_apply">应用</button>
    <span class="hint" data-i18n="hint">客户端自动周期上报；服务器每收到一条即点亮对应行。</span>
  </div>
</section>

<script src="ui_i18n.js"></script>
<script src="app.js?v=20260909c"></script>
</body>
</html>
