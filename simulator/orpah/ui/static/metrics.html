<!DOCTYPE html>
<html lang="zh-CN" data-i18n-doc-title="doc_metrics">
<head>
<meta charset="utf-8">
<title>指标面板 — ORPAH-over-HaLow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260910e">
<style>
  .back { margin-left: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row label { display: flex; align-items: center; gap: 6px; }
  .row select, .row input {
    background: #0d1117; color: var(--txt); border: 1px solid var(--bd);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
  }
  /* 四张指标卡：两列自适应 */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
          gap: 14px; margin: 14px 18px; }
  .mcard { background: var(--card); border: 1px solid var(--bd); border-radius: 8px;
           padding: 12px 16px; }
  .mcard h3 { margin: 0 0 8px; font-size: 15px; }
  .big { font-size: 26px; font-weight: 600; color: var(--acc); }
  .big.id { color: var(--id); }
  .big.mut { color: var(--mut); font-size: 20px; }
  .kv { font-size: 13px; color: var(--txt); }
  .kv b { color: var(--acc); }
  .kv .u { color: var(--mut); }
  .hint.err { color: var(--red); }
  .kv.err { color: var(--red); }
  /* 算法分布：横条（宽度按占比） */
  .bars { margin-top: 8px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
  .bar .nm { width: 74px; color: var(--mut); }
  .bar .tr { flex: 1; background: #0d1117; border-radius: 4px; height: 10px; overflow: hidden; }
  .bar .tr i { display: block; height: 100%; background: var(--id); }
  .bar .vv { width: 74px; text-align: right; color: var(--txt); }
  table.m { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.m th, table.m td { padding: 4px 6px; font-size: 12px; text-align: left; }
  table.m th { color: var(--mut); font-weight: 400; }
  .todo { color: var(--mut); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="index.html" data-i18n-title="nav_home_title" title="返回主页"><img class="brand-logo" src="orpah-logo.png" alt="orpah"></a> <span class="brand-name" data-i18n="nav_metrics">指标面板</span>
    <span class="sub" data-i18n="mt_sub">签名校验 / 算法分布 / RSSI / 走失处置时长</span>
    <a class="btn back" href="rssi.html" data-i18n="nav_rssi">RSSI 定位算法</a>
    <a class="btn back" href="index.html" data-i18n="nav_home">← 返回主页</a>
  </div>
  <div class="tools">
    <span class="badge" id="mtState">--</span>
    <button class="btn" id="btnRefresh" data-i18n="mt_refresh">刷新</button>
  </div>
</header>

<section class="card">
  <div class="row">
    <label><span data-i18n="mt_window">统计窗口</span>
      <select id="minutes">
        <option value="15">15 min</option>
        <option value="60" selected>60 min</option>
        <option value="180">3 h</option>
        <option value="720">12 h</option>
        <option value="1440">24 h</option>
      </select>
    </label>
    <label><span data-i18n="lbl_sn">序列号</span> <input id="sn" size="22" spellcheck="false"></label>
    <span class="hint" data-i18n="mt_hint">数据来自 IoTDB 事件流 / 上报流 + 案件表；窗口只作用于前两项，处置时长是全量口径。</span>
  </div>
</section>

<div class="grid">
  <div class="mcard">
    <h3 data-i18n="mt_verify">签名校验</h3>
    <div class="big id" id="vRatio">--</div>
    <div class="kv" id="vCounts"></div>
    <div class="bars" id="vAlg"></div>
  </div>
  <div class="mcard">
    <h3 data-i18n="mt_rssi">平均 RSSI</h3>
    <div class="big" id="rAvg">--</div>
    <div class="kv" id="rDetail"></div>
  </div>
  <div class="mcard">
    <h3 data-i18n="mt_case">走失处置时长</h3>
    <div class="kv" id="cFound"></div>
    <div class="kv" id="cClose"></div>
    <div class="kv" id="cOpen"></div>
    <div class="kv err" id="cInvalid" hidden></div>
    <table class="m" id="cTable"></table>
  </div>
  <div class="mcard">
    <h3 data-i18n="mt_err">定位误差 CDF</h3>
    <div class="todo" data-i18n-html="mt_err_todo">未做（阶段二）：误差需要<b>地面真值</b>，而真值只有模拟器里有（motion.py 的行走模型）。</div>
  </div>
</div>

<script src="ui_i18n.js"></script>
<script>
const T = (k) => OrpahI18n.t(k);
const $ = (id) => document.getElementById(id);
let timer = null;

/* 转义：本页只把**数字与时长**直接插进模板，唯一的外部字符串是算法名
   （来自空口报文头的 alg，经 metrics.alg_of 白名单过滤）。metrics.py 已经只放行令牌字符，
   这里再转一道 —— 展示层永远不信任上游（与 app.js 的 esc() 同一纪律）。*/
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDur(sec) {
  if (sec === null || sec === undefined) return "—";
  if (sec < 0) return "—";          // 兜底：负时长没意义（后端已置 None，这里不信任上游）
  sec = Math.max(0, Math.round(sec));
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
        m = Math.floor((sec % 3600) / 60), s = sec % 60;
  let out = T(d ? "dur_dh" : (h ? "dur_hm" : (m ? "dur_ms" : "dur_s")));
  Object.entries({ d, h, m, s }).forEach(([k, v]) => {
    out = out.split("{" + k + "}").join(String(v));
  });
  return out;
}
const pct = (r) => (r === null || r === undefined) ? "—" : (r * 100).toFixed(1) + "%";

function render(d) {
  // 签名校验
  const v = d.verify || {};
  $("vRatio").textContent = pct(v.fail_ratio);
  $("vCounts").innerHTML =
    T("mt_v_counts").replace("{r}", `<b>${v.rejected ?? 0}</b>`)
                    .replace("{t}", `<b>${v.total ?? 0}</b>`)
    + ` <span class="u">· ${T("mt_v_ok")} <b>${v.reports ?? 0}</b></span>`;
  const algs = Object.entries(v.by_alg || {}).sort((a, b) => b[1] - a[1]);
  const tot = algs.reduce((s, [, n]) => s + n, 0) || 1;
  $("vAlg").innerHTML = algs.length ? algs.map(([k, n]) =>
    `<div class="bar"><span class="nm">${esc(k)}</span>` +
    `<span class="tr"><i style="width:${(n / tot * 100).toFixed(1)}%"></i></span>` +
    `<span class="vv">${n} · ${(n / tot * 100).toFixed(0)}%</span></div>`).join("")
    : `<div class="todo">${T("mt_no_sample")}</div>`;

  // 平均 RSSI
  const r = d.rssi || {};
  $("rAvg").textContent = (r.avg === null || r.avg === undefined)
    ? T("mt_na") : r.avg + " dBm";
  $("rDetail").innerHTML = r.n
    ? T("mt_r_detail").replace("{n}", `<b>${r.n}</b>`)
        .replace("{min}", `<b>${r.min}</b>`).replace("{max}", `<b>${r.max}</b>`)
    : `<span class="todo">${T("mt_no_sample")}</span>`;

  // 走失处置时长
  const c = d.cases || {};
  $("cFound").innerHTML = T("mt_c_found")
    .replace("{avg}", `<b>${fmtDur(c.to_found && c.to_found.avg)}</b>`)
    .replace("{min}", fmtDur(c.to_found && c.to_found.min))
    .replace("{max}", fmtDur(c.to_found && c.to_found.max))
    .replace("{n}", (c.to_found && c.to_found.n) || 0);
  $("cClose").innerHTML = T("mt_c_close")
    .replace("{avg}", `<b>${fmtDur(c.to_close && c.to_close.avg)}</b>`)
    .replace("{min}", fmtDur(c.to_close && c.to_close.min))
    .replace("{max}", fmtDur(c.to_close && c.to_close.max))
    .replace("{n}", (c.to_close && c.to_close.n) || 0);
  $("cOpen").innerHTML = T("mt_c_open")
    .replace("{o}", `<b>${c.open ?? 0}</b>`).replace("{t}", `<b>${c.total ?? 0}</b>`);
  // 脏数据（缺 created 被跳过）：不猜时长，但也不能静默少报案件数
  $("cInvalid").hidden = !c.invalid;
  if (c.invalid) $("cInvalid").textContent = T("mt_c_invalid").replace("{n}", c.invalid);
  const head = `<tr><th>${T("case_th_id")}</th><th>${T("th_person")}</th>` +
               `<th>${T("mt_th_found")}</th><th>${T("mt_th_close")}</th>` +
               `<th>${T("mt_th_elapsed")}</th></tr>`;
  const rows = (c.rows || []).map(x =>
    `<tr><td>${x.case_id}</td><td>${x.person_id || "—"}</td>` +
    `<td>${fmtDur(x.to_found_sec)}</td><td>${fmtDur(x.to_close_sec)}</td>` +
    `<td>${fmtDur(x.elapsed_sec)}</td></tr>`).join("");
  $("cTable").innerHTML = (c.rows || []).length ? head + rows : "";
}

async function load() {
  const q = `?minutes=${$("minutes").value}&sn=${encodeURIComponent($("sn").value.trim())}`;
  try {
    const d = await (await fetch("/api/metrics" + q)).json();
    render(d);
    const st = $("mtState");
    st.hidden = false;
    st.className = "badge" + (d.tsdb ? " on" : "");
    st.textContent = d.tsdb ? T("mt_tsdb_ok") : T("mt_tsdb_no");
  } catch (e) {
    $("mtState").textContent = T("err_offline");
  }
}

$("btnRefresh").onclick = load;
$("minutes").onchange = load;
$("sn").onchange = load;

// 窗口/SN 从 URL 带过来（别的页跳转过来时能直接看某台设备）
const qp = new URLSearchParams(location.search);
if (qp.get("minutes")) $("minutes").value = qp.get("minutes");
if (qp.get("sn")) $("sn").value = qp.get("sn");

OrpahI18n.apply();
if (OrpahI18n.bootLangBtn) OrpahI18n.bootLangBtn();
fetch("/api/status").then(r => r.json()).then(s => {
  if (!$("sn").value) $("sn").value = s.sn || "";
  load();
  timer = setInterval(() => { if (!document.hidden) load(); }, 15000);
}).catch(() => load());
</script>
</body>
</html>
